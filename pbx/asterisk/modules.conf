; modules.conf — ReJack home PBX: load everything except what conflicts or isn't used
[modules]
autoload=yes
; only one voicemail backend may load: keep file storage (app_voicemail.so)
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so
; channel drivers we don't use (SIP is PJSIP only)
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so
noload => chan_mgcp.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => chan_iax2.so
noload => chan_dahdi.so
noload => chan_mobile.so
noload => chan_ooh323.so
noload => chan_motif.so
