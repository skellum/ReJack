; extensions.conf — ReJack home PBX dial plan
; Internal extensions and test numbers; outside calls via the SIP trunk (extensions_trunk.conf, if configured).

[general]
static=yes
writeprotect=yes

[rejack-phones]
; extensions 100-109: ring 25 s; no answer / not registered -> voicemail "unavailable", busy -> "busy"
exten => _10X,1,NoOp(Call ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},25)
 same => n,NoOp(DIALSTATUS=${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()
 same => n(busy),VoiceMail(${EXTEN}@default,b)
 same => n,Hangup()

; *97: your own mailbox, no PIN (mailbox = the authenticated endpoint, not caller ID)
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CHANNEL(endpoint)}@default,s)
 same => n,Hangup()
; *98: any mailbox, asks for mailbox number and PIN
exten => *98,1,Answer()
 same => n,VoiceMailMain(@default)
 same => n,Hangup()

; 600: echo test — you hear yourself (checks both audio directions and echo)
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; 601: "hello world" + reads back your extension (checks the far-end -> phone direction)
exten => 601,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(hello-world)
 same => n,SayDigits(${CALLERID(num)})
 same => n,Hangup()

; 911 / 1911 / 9911 — TEST ONLY. Not routed to the trunk until E911 is registered and 933 confirms it.
; Congestion makes ReJack's "911 failed" fallback run (announcement + recording + contact alerts).
; Then: exten => 911 via Dial(PJSIP/911@trunk) with CALLERID(num)=${TRUNK_DID} (docs/QUICKSTART.md 4d).
exten => 911,1,NoOp(TEST 911 from ${CALLERID(num)} — no trunk, not a real emergency call)
 same => n,Congestion(5)
exten => 1911,1,Goto(911,1)
exten => 9911,1,Goto(911,1)

; outside numbers over the trunk, then the intercept for anything else (includes are searched in this order,
; after the extensions above)
include => trunk-out
include => intercept

[intercept]
; anything else: intercept message as early media (183, not answered), then 404 (cause 1, unallocated)
exten => _X.,1,Progress()
 same => n,Playback(cannot-complete-as-dialed,noanswer)
 same => n,Hangup(1)

; [from-trunk] and [trunk-out]: rendered by pbx/install.sh (a stub with empty contexts when there is no trunk)
#tryinclude extensions_trunk.conf
